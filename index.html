    <!-- Content Security Policy: restricts where scripts, styles, images, and network calls may come from -->

      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://maps.googleapis.com https://www.googletagmanager.com https://www.google-analytics.com https://cdn.gpteng.co;

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- PWA -->
    <script>
      (function () {
        var isKitchen = window.location.pathname.indexOf('/kitchen') === 0;
        document.write('<link rel="manifest" href="' + (isKitchen ? '/kitchen.webmanifest' : '/manifest.webmanifest') + '" />');
        if (isKitchen) {
          document.title = 'מטבח - הבקתה';
          window.__HABAKTA_KITCHEN_INSTALL__ = true;
        }
      })();
    </script>
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="הבקתה" />

    <!-- iOS / Apple Touch -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="הבקתה" />
    <script>
      (function () {
        if (!window.__HABAKTA_KITCHEN_INSTALL__) return;
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        var appName = document.querySelector('meta[name="application-name"]');
        if (appleTitle) appleTitle.setAttribute('content', 'מטבח');
        if (appName) appName.setAttribute('content', 'מטבח - הבקתה');
      })();
    </script>
