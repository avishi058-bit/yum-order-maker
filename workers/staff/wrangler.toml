# Staff shifts worker: Web Push reminders + calendar feed for the employee page.
# Deployed on Cloudflare Workers (free) from GitHub. No Cloudflare secrets: the
# database sends the VAPID private key and the cleanup secret with each /notify
# call (from its service-only internal_config), and the worker refuses any key
# that does not match VAPID_PUBLIC_KEY below.
name = "habikta-staff"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
SUPABASE_URL = "https://kdkcygokopwvutwvrgnp.supabase.co"
# Public anon key (same one the website ships to every browser).
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtka2N5Z29rb3B3dnV0d3ZyZ25wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTA2NzYsImV4cCI6MjA5MTc2NjY3Nn0.Cm6lMGNzDRmVFP6rBDmmLXItRuc3DMKG9VUNcmkEHxQ"
VAPID_PUBLIC_KEY = "BHR6NU3HFQfRUBH7-zszku0KsyrM-MF5smrT4AGagPgY12AQEb5A-Sfg-Cqq1awexbzWceiErcXESPmD9Stucw4"
VAPID_SUBJECT = "mailto:shifts@habikta-burger.com"

# SMS sender name shown to customers (English letters, up to 11). Empty until an
# SMS4Free package is bought: until then messages come from the owner's number.
SMS_SENDER = ""

# Customer SMS: one-time codes and send limits (see src/sms.js).
[[kv_namespaces]]
binding = "SMS_KV"
id = "416d00188a474ba99af08b3c30382402"

# Workers AI (free daily allowance) reads the owner's shopping receipts.
[ai]
binding = "AI"
